<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ELOS — sem conexão</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7fb;
        color: #14142b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e6e8f0;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
      }
      .logo {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: #7c3aed;
        color: #fff;
        font-weight: 900;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #6b7280; font-size: 0.9rem; margin: 0 0 1.25rem; line-height: 1.5; }
      button {
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 1.1rem;
        background: #7c3aed;
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">E</div>
      <h1>Sem conexão</h1>
      <p>
        O ELOS precisa de internet para carregar suas missões e o ranking.
        Confira sua conexão e tente de novo.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
